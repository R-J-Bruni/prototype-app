<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training companion app: prototype</title>
<style>
/* Neutral prototype theme: slate ink, teal accent, soft corners */
:root{
  --ink:#172A3A; --ink2:#2C4A5E; --acc:#0F766E; --g80:#33424F; --g70:#2C4A5E; --g60:#5F6E7A; --g30:#B4BFC7; --g15:#C9D3DA; --g10:#DDE4E9; --g5:#F2F5F7; --ok:#2E7D32; --bad:#C62828; --warn:#9A6700; --pad:16px; --r:6px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --wide:var(--font);
}
@media (min-width:375px){:root{--pad:28px}}
@media (min-width:768px){:root{--pad:40px}}
@media (min-width:1024px){:root{--pad:60px}}
@media (min-width:1440px){:root{--pad:96px}}
.ic{width:24px;height:24px;flex:none;display:block}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit}
a{color:inherit}
.hidden{display:none!important}
.hint{font-size:14px;color:var(--g60)}
.file{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--g80);word-break:break-all}

/* prototype switcher (not part of the app) */
.pbar{position:sticky;top:0;z-index:60;display:flex;gap:6px;align-items:center;height:32px;padding:0 10px;background:var(--g5);border-bottom:1px solid var(--g15);font-size:12px;color:var(--g60)}
.pbar b{font-weight:700;margin-right:6px;letter-spacing:.06em;color:var(--ink)}
.pbar button{background:#fff;border:1px solid var(--g30);padding:2px 10px;color:var(--g60)}
.pbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pbar .sp{flex:1}
.pbar .reset{border:0;background:none;text-decoration:underline}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:144px;background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:var(--r);padding:12px 24px;font-family:var(--wide);font-size:16px}
@media (hover:hover){.btn:hover{background:var(--g70);border-color:var(--g70)}}
.btn:disabled{background:var(--g30);border-color:var(--g30);color:#fff;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--ink)}
@media (hover:hover){.btn.sec:hover{background:var(--g5)}}
.btn.inv{background:#fff;color:var(--ink);border-color:#fff}
.btn.inv-sec{background:transparent;color:#fff;border-color:#fff}
.btn.sm{min-width:0;padding:7px 14px;font-size:14px}
.tbtn{background:none;border:0;padding:4px 0;font-size:15px;display:inline-flex;gap:6px;align-items:center}
@media (hover:hover){.tbtn:hover{text-decoration:underline}}

/* ========== PARTICIPANT ========== */
.head{background:var(--ink);color:#fff;height:64px;display:flex;align-items:center;padding:0 var(--pad)}
.head .t{flex:1;font-family:var(--wide);font-weight:400;font-size:16px;line-height:24px}
@media (min-width:1024px){.head .t{font-size:20px;line-height:32px}}
.head img{height:28px}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--pad) 110px}
.col{max-width:880px;margin:0 auto}
.sub-bar{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--g15);margin-bottom:22px}
.sub-bar .sp{flex:1}
.tok{display:flex;align-items:center;gap:6px;font-size:14px}
.tok img{width:24px;height:24px}
h2{font-family:var(--wide);font-weight:400;font-size:24px;line-height:36px;margin:0 0 8px}
@media (min-width:1024px){h2{font-size:28px;line-height:40px}}
@media (min-width:1440px){h2{font-size:32px;line-height:44px}}
.sub{color:var(--g60);margin:0 0 20px;font-size:15px}

/* sign-in, mobile: clone of the current app */
.msi{position:relative;height:calc(100vh - 32px);height:calc(100svh - 32px);overflow:hidden;background:var(--ink)}
.msi .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.msi-ctl{position:absolute;left:16%;right:10%;bottom:16%}
.msi-ctl form{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.mbtn{background:var(--ink);color:#fff;border:0;border-radius:var(--r);min-width:150px;padding:18px 26px;font-family:var(--font);font-size:24px;line-height:1.2}
.mbtn:disabled{opacity:1;color:#fff;cursor:pointer}
.msi #si{min-width:200px}
.minp{width:100%;background:rgba(0,0,0,.55);border:1px solid #ddd;border-radius:3px;color:#fff;padding:14px 18px;font-size:17px;outline:none}
.minp::placeholder{color:#aaa}
.msf .top{width:100%;display:block}
.msf-in{padding:28px 24px 40px}
.msf h2{font-family:var(--wide);font-weight:700;color:#333;font-size:24px;margin:0 0 18px}
.msf .dfield{margin-bottom:22px}
.msf .dfield label{font-family:var(--wide);font-weight:700;font-size:16px}
.msf .dfield input{border-bottom:1px solid var(--ink);padding:6px 0;font-size:18px}
.msf .dfield select{border:1px solid #bbb;border-radius:3px;padding:8px 10px;font-size:18px;background:#fff}
.msf .btnrow{gap:10px;padding-left:14px}
/* sign-in, desktop: split screen */
.signin{display:grid;grid-template-columns:minmax(400px,40%) 1fr;min-height:calc(100vh - 32px);background:var(--ink);color:#fff}
.signin .pic{order:2;position:relative;overflow:hidden;background:#111}
.signin .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.signin .spp{order:1;padding:48px 56px;display:flex;flex-direction:column}
.signin .brand{height:32px;width:max-content}
.signin .spc{margin:auto 0;display:flex;flex-direction:column;gap:16px;max-width:440px}
.signin h1{font-family:var(--wide);font-weight:400;font-size:36px;line-height:52px;margin:0}
@media (min-width:1440px){.signin h1{font-size:40px;line-height:60px}}
.signin h2{margin:0 0 4px}
.signin .lead{margin:0;color:#b3b3b3}
.dfield{margin-bottom:16px}
.dfield label{display:block;font-size:14px;font-weight:700;margin-bottom:2px}
.dfield input,.dfield select{width:100%;padding:10px 0;border:0;border-bottom:1px solid currentColor;border-radius:var(--r);background:transparent;color:inherit;outline:none}
.dfield select option{color:var(--ink)}
.dfield input::placeholder{color:#999}
.signin .dfield input:focus,.signin .dfield select:focus{border-bottom-width:2px;padding-bottom:9px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
/* activity tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
@media (min-width:768px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1100px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;border:0;padding:0;background:var(--g10);display:block;overflow:hidden}
.tile img{width:100%;aspect-ratio:700/392;object-fit:cover;display:block;transition:transform .4s}
@media (hover:hover){.tile:hover img{transform:scale(1.03)}}
.tile .done{position:absolute;top:8px;right:8px;background:#fff;color:var(--ok);font-size:13px;padding:2px 8px}

/* activity landing: mobile stacked, desktop split */
.land{display:grid;margin:0 calc(-1 * var(--pad)) 0}
.land .pic img{width:100%;aspect-ratio:700/392;object-fit:cover;display:block}
.land .txt{padding:24px var(--pad)}
.land .kicker{font-family:var(--wide);font-weight:700;font-size:16px;line-height:24px;margin:0 0 10px}
.land .intro{font-size:20px;line-height:32px;margin:0 0 24px}
@media (min-width:900px){
  .land{grid-template-columns:2fr 3fr;margin:0;background:var(--ink);color:#fff;align-items:stretch}
  .land .pic{order:2}
  .land .pic img{height:auto}
  .land .txt{order:1;padding:40px 48px;display:flex;flex-direction:column;justify-content:center}
  .land .intro{color:#d9d9d9}
  .land .btn{background:#fff;color:var(--ink);border-color:#fff;align-self:flex-start}
}

/* question screen */
.q-head{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:2px;background:var(--g15)}
.prog i{display:block;height:100%;background:var(--ink)}
.q-count{font-size:14px;color:var(--g60);white-space:nowrap}
.q-title{font-family:var(--wide);font-weight:700;text-align:center;margin:14px 0 4px;font-size:16px}
.q-text{display:flex;gap:10px;font-family:var(--wide);font-size:20px;line-height:32px;margin:14px 0 4px}
@media (min-width:1440px){.q-text{font-size:24px;line-height:36px}}
.q-help{font-size:14px;color:var(--g60);margin:0 0 14px}
.q-img{margin:0 0 16px}
.q-img img{max-width:100%;display:block}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1px solid var(--g30);border-radius:var(--r);padding:14px 16px}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--ink)}}
.opt .mk{flex:none;width:22px;height:22px;border:1px solid var(--g60);display:grid;place-items:center}
.opt .mk .ic{width:20px;height:20px}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.sel .mk{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.right{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.right .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--g30)}
.opt.wrong.picked{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.opt.wrong .mk{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default;opacity:1}
/* picture answers: full image, never cropped */
.opts.pics{grid-template-columns:1fr}
@media (min-width:700px){.opts.pics{grid-template-columns:repeat(3,1fr)}}
.opt.pic{flex-direction:column;align-items:stretch;padding:0;gap:0}
.opt.pic .pl{display:flex;align-items:center;gap:10px;padding:10px 12px;font-family:var(--wide)}
.opt.pic .im{background:var(--g5);display:flex;align-items:center;justify-content:center}
.opt.pic .im img{width:100%;height:auto;display:block}
.zoom{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-family:var(--font);color:var(--g60)}
.zoom .ic{width:18px;height:18px}
.btn .ic{width:20px;height:20px}
.tbtn .ic{width:20px;height:20px}
.review .ic{width:20px;height:20px}
.tile .done{display:inline-flex;align-items:center;gap:2px}
.tile .done .ic{width:18px;height:18px}
.scale{display:flex;gap:6px;max-width:520px}
.scale button{flex:1;border:1px solid var(--g30);background:#fff;padding:12px 0;font-size:18px}
.scale button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.scale-l{display:flex;justify-content:space-between;max-width:520px;font-size:13px;color:var(--g60);margin-top:6px}
.verdict{margin:0 0 14px;font-family:var(--wide);font-size:17px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.more{margin-top:28px;border-top:1px solid var(--g15);padding-top:20px}
.more-h{display:flex;align-items:center;gap:10px;font-family:var(--wide);font-size:18px;margin:0 0 14px}

.facts{display:grid;gap:4px}
.fact{display:grid;grid-template-columns:44px 1fr;gap:8px;background:var(--g5);padding:18px 20px;font-size:16px;line-height:1.55}
.fact .no{font-family:var(--wide);font-size:14px;color:var(--g60);padding-top:2px}
.field{margin-bottom:18px}
.field textarea{width:100%;min-height:140px;resize:vertical;border:1px solid var(--g60);border-radius:var(--r);padding:10px}
.missing{display:grid;place-items:center;aspect-ratio:4/3;width:100%;background:var(--g5);border:1px dashed var(--g30);color:var(--g60);font-size:13px;text-align:center;padding:10px}
.actbar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.08);padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));z-index:20}
.actbar .in{max-width:880px;margin:0 auto;display:flex;gap:12px;align-items:center}
.actbar .msg{flex:1;font-size:14px;color:var(--g60)}
.score{font-family:var(--wide);font-size:56px;line-height:1;margin:8px 0 12px}
.badge{display:inline-block;font-size:15px;padding:6px 12px;margin-bottom:10px}
.badge.pass{background:#e7f6e7;color:var(--ok)}
.badge.fail{background:#fde7ec;color:var(--bad)}
.review{margin-top:20px}
.review div{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--g10);font-size:15px}
.review .ic{width:18px;flex:none}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:90;display:grid;place-items:center;padding:20px}
.lightbox img{max-width:100%;max-height:90vh}
@media (max-width:767px){
  .actbar{padding:0;box-shadow:none}
  .actbar .msg{display:none}
  .actbar .btn{width:100%;padding:18px;border:0}
  .actbar .in{gap:0}
}

/* ========== ADMIN ========== */
.a-shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 32px)}
.a-side{background:#fff;border-right:1px solid var(--g15);padding:20px 16px;display:flex;flex-direction:column}
.a-side .brand{height:20px;width:max-content;margin:0 0 6px}
.a-side .app{font-family:var(--wide);font-size:14px;margin-bottom:18px}
.a-side .prog-sel{margin:0 0 18px;border:0;border-bottom:1px solid var(--g60);padding:8px 0;font-size:14px;background:transparent}
.a-side button.nav{background:none;border:0;text-align:left;padding:10px 0;font-size:15px;color:var(--g60);border-bottom:1px solid var(--g10)}
.a-side button.nav:hover{color:var(--ink)}
.a-side button.nav.on{color:var(--ink);font-weight:700}
.a-side .who{margin-top:auto;padding-top:20px;font-size:13px;color:var(--g60)}
.a-side .who select{width:100%;margin-top:4px;border:1px solid var(--g30);padding:6px;background:#fff}
.a-main{padding:28px 32px 80px;background:var(--g5);min-width:0}
.a-main h1{font-family:var(--wide);font-weight:400;font-size:28px;line-height:40px;margin:0 0 4px}
@media (min-width:1024px){.a-main h1{font-size:36px;line-height:52px}}
.crumb{font-size:14px;margin-bottom:10px}
.panel{background:#fff;padding:20px;margin-bottom:16px;min-width:0}
.panel h3{font-family:var(--wide);font-weight:400;margin:0 0 4px;font-size:17px}
.panel .ph{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel .ph > div{flex:1;min-width:200px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t{border-collapse:separate!important;border-spacing:16px 0}
.t th{text-align:left;font-weight:400;color:var(--g60);font-size:12px;line-height:16px;padding:12px 0 8px;border-bottom:2px solid var(--ink)}
.t td{padding:12px 0;border-bottom:1px solid var(--g15);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.link{cursor:pointer}
.t tr.link:hover td{background:var(--g5)}
.t .rank{font-family:var(--wide);width:40px}
.t .num{text-align:right;font-family:var(--wide);font-size:16px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.bad{color:var(--bad)} .st.grey{color:var(--g60)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;background:var(--g5);color:var(--g80);white-space:nowrap}
.tag.dark{background:var(--ink);color:#fff}
.tours{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 18px}
.tours button{border:1px solid var(--g30);background:#fff;padding:7px 14px;font-size:14px}
.tours button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.live-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.join{flex:0 0 260px}
.qr{width:200px;height:200px;display:block;margin:8px 0 10px}
.link-box{background:var(--g5);padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}
.drop{border:1px dashed var(--g60);padding:26px;text-align:center;color:var(--g60);background:#fff;display:block;cursor:pointer}
.drop.over{border:1px solid var(--ink);color:var(--ink);background:var(--g5)}
.check{list-style:none;padding:0;margin:14px 0 0;font-size:14px}
.check li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--g10)}
.check .i{width:20px;flex:none}
.check .i .ic{width:20px;height:20px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:80;display:grid;place-items:center;padding:20px}
.modal{background:#fff;width:min(560px,100%);max-height:90vh;overflow:auto;padding:28px}
.modal h3{font-family:var(--wide);font-weight:400;margin:0 0 6px;font-size:20px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.modal .field label{display:block;font-size:14px;color:var(--g60);margin-bottom:4px}
.modal .field input,.modal .field select{width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--g60);background:transparent;border-radius:var(--r)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.y{color:var(--ok)} .n{color:var(--g30)}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
.asset{background:var(--g5);font-size:13px;display:flex;flex-direction:column}
.asset .th{aspect-ratio:1;background:var(--g10);display:grid;place-items:center;color:var(--g60);overflow:hidden;position:relative}
.asset .th img{width:100%;height:100%;object-fit:contain;display:block}
.asset .th .new{position:absolute;top:6px;left:6px;background:var(--ink);color:#fff;font-size:11px;padding:1px 6px}
.asset .meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.asset .meta .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.asset.miss .th{border:1px dashed var(--warn)}
.unmatched{margin-top:16px;border-top:1px solid var(--g15);padding-top:14px}
.unmatched .u{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--g10);flex-wrap:wrap}
.unmatched img{width:72px;height:54px;object-fit:cover;flex:none}
.unmatched select{border:1px solid var(--g30);padding:6px;background:#fff;max-width:260px}
.seg-pick{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.seg-pick button{border:1px solid var(--g30);background:#fff;padding:6px 12px;font-size:13px}
.seg-pick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bars{margin-top:14px}
.bar{padding:8px 0;border-bottom:1px solid var(--g10)}
.bar .bl{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px;gap:12px}
.bar .bt{height:6px;background:var(--g10)}
.bar .bt i{display:block;height:100%;background:var(--ink)}
.present{position:fixed;inset:0;background:#fff;color:var(--ink);z-index:95;padding:56px 6vw 40px;overflow:auto}
.present .brand{height:26px;position:absolute;top:20px;left:6vw}
.present h2{font-size:clamp(24px,3vw,40px);max-width:1100px;line-height:1.2;margin-top:24px}
.present .bar .bl{font-size:clamp(16px,1.7vw,24px)}
.present .bar .bt{height:14px}
.present .bars{max-width:1100px}
.present .t{font-size:clamp(16px,1.6vw,22px);max-width:1100px}
.present .x{position:absolute;top:16px;right:24px}
.toast{position:fixed;bottom:24px;right:var(--pad);background:var(--ink);color:#fff;padding:14px 20px;font-size:14px;z-index:99;max-width:calc(100vw - 2 * var(--pad))}
@media (max-width:767px){
  .a-shell{grid-template-columns:1fr}
  .a-side{flex-direction:row;flex-wrap:wrap;padding:10px 12px;gap:0 14px;border-right:0;border-bottom:1px solid var(--g15)}
  .a-side .brand,.a-side .app,.a-side .prog-sel{display:none}
  .a-side button.nav{border:0;padding:6px 0}
  .a-side .who{margin:0;padding:4px 0;width:100%}
  .a-main{padding:16px}
  .hide-m{display:none}
}
/* soft corners + accent */
.tile,.opt.pic,.panel,.modal,.fact,.asset,.tours button,.seg-pick button,.scale button,.tag,.badge,.link-box,.drop,.toast{border-radius:var(--r)}
.tile,.opt.pic{overflow:hidden}
.prog i,.bar .bt i{background:var(--acc)}
.prog,.bar .bt{border-radius:3px;overflow:hidden}
@media (max-width:480px){.pbar b{display:none}.pbar button{white-space:nowrap;padding:2px 8px}}
.signin h1{line-height:1.15!important}
h1,h2,h3,.q-text,.head .t,.signin h1,.a-main h1{font-weight:600;letter-spacing:-.01em}

king to customers? Select one.", "kind": "PICKX", "pick": 1, "responses": [{"t": "New electronic architecture", "c": false}, {"t": "new-engine-x", "c": false}, {"t": "Updated engine-y", "c": false}, {"t": "All-wheel drive system (Model A, Model B)", "c": false}, {"t": "All-wheel drive system (Sport versions)", "c": false}, {"t": "Adaptive air suspension", "c": false}, {"t": "Digital LED headlights", "c": false}, {"t": "Advanced turn signals", "c": false}, {"t": "Curved tail lights in Model B", "c": false}, {"t": "Driver assistance with hands-free driving", "c": false}, {"t": "Remote park assist", "c": false}], "fact": null, "image": null}], "id": "tech1", "tile": "tile-tech1", "label": "You vote: first impressions", "kind": "poll", "file": "youvote-first-impressions_program-1.xlsx"}, {"title": "Hands-on: new Model A", "introTitle": "Search and find out", "intro": "Get hands-on with the new Model A’s versatility, infotainment and controls to sharpen your presentations, deliveries and walkarounds.", "questions": [{"key": "question-1", "text": "Which image marks every cargo hook location in the rear cargo area of the new Model A?", "kind": "MC", "pick": 1, "responses": [{"t": "A", "c": true, "img": "model-a-hands-on_1"}, {"t": "B", "c": false, "img": "model-a-hands-on_2"}, {"t": "C", "c": false, "img": "model-a-hands-on_3"}], "fact": "Side rails with movable hooks are added at the Plus trim.\n\nRotate the front of each rail hook to move it, then rotate back to lock it in place.\n\nThere are also fixed hooks on each side of the cargo area.", "image": null}, {"key": "question-2", "text": "Which image shows the space under the rear cargo floor in the new Model A?", "kind": "MC", "pick": 1, "responses": [{"t": "A", "c": false, "img": "model-a-hands-on_4"}, {"t": "B", "c": true, "img": "model-a-hands-on_5"}, {"t": "C", "c": false, "img": "model-a-hands-on_6"}], "fact": "Every model comes with a tire repair kit.\n\nThe cargo cover and cargo net can both be stored under the floor.", "image": null}, {"key": "question-3", "text": "Which is TRUE about the trailer hitch in the new Model A?", "kind": "MC", "pick": 1, "responses": [{"t": "A", "c": false, "img": "model-a-hands-on_7"}, {"t": "B", "c": false, "img": "model-a-hands-on_8"}, {"t": "C", "c": true, "img": "model-a-hands-on_9"}], "fact": "Open the hitch cover by turning the two screw caps a quarter turn, then pivot the cover down.\n\nThe trailer hitch is a standalone option on every trim.", "image": null}, {"key": "question-4", "text": "Which sticker is on the inside of the fuel door on the new Model A?", "kind": "MC", "pick": 1, "responses": [{"t": "A", "c": false, "img": "model-a-hands-on_10"}, {"t": "B", "c": false, "img": "model-a-hands-on_11"}, {"t": "C", "c": true, "img": "model-a-hands-on_12"}], "fact": "The new-engine-x is tuned for high boost, so premium fuel is recommended.\n\nThe same recommendation applies to engine-y.", "image": null}, {"key": "question-5", "text": "Which wireless charging specification is accurate for the new Model A?", "kind": "MC", "pick": 1, "responses": [{"t": "A", "c": false, "img": "model-a-hands-on_13"}, {"t": "B", "c": true, "img": "model-a-hands-on_14"}, {"t": "C", "c": false, "img": "model-a-hands-on_15"}], "fact": "Two wireless charging pads support phones up to 25 watts.\n\nA cooling fan keeps the pads at full charging speed.\n\nSecond- and third-row passengers get fast-charging USB-C ports.", "image": null}, {"key": "question-6", "text": "Which feature has a demo mode?", "kind": "MC", "pick": 1, "responses": [{"t": "A", "c": false, "img": "model-a-hands-on_16"}, {"t": "B", "c": true, "img": "model-a-hands-on_17"}, {"t": "C", "c": false, "img": "model-a-hands-on_18"}], "fact": "Open the head-up display settings on the main screen and choose Demo mode.\n\nThe head-up display is added at the Plus trim.", "image": null}, {"key": "question-7", "text": "Which image shows where the memory card goes to turn on the dash camera?", "kind": "MC", "pick" a-hands-on_33"}], "fact": "Lighting effects come with the digital LED headlights, added at the Top trim.", "image": null}, {"key": "question-12", "text": "Which image marks the shortcut to front seat massage on the main screen?", "kind": "MC", "pick": 1, "responses": [{"t": "A", "c": true, "img": "model-a-hands-on_34"}, {"t": "B", "c": false, "img": "model-a-hands-on_35"}, {"t": "C", "c": false, "img": "model-a-hands-on_36"}], "fact": "Press the centre of the lumbar control on the side of the seat to open massage settings.\n\nThere are five massage types, each with adjustable intensity.", "image": null}], "id": "hoa", "tile": "tile-ho-a", "label": "Hands-on: new Model A", "kind": "quiz", "file": "hands-on-model-a_program-1.xlsx"}, {"title": "Hands-on: new Model B", "introTitle": "Search and find out", "intro": "Get hands-on with the new Model B’s versatility, infotainment and controls to sharpen your presentations, deliveries and walkarounds.", "questions": [{"key": "question-1", "text": "Which image shows the Model B front grille?", "kind": "MC", "pick": 1, "responses": [{"t": "A", "c": true, "img": "model-b-hands-on_1"}, {"t": "B", "c": false, "img": "model-b-hands-on_2"}, {"t": "C", "c": false, "img": "model-b-hands-on_3"}], "fact": "A) Model B grille.\n\nB) Model B Sport grille.\n\nC) Model A grille.\n\nAn illuminated grille is added at the Top trim.", "image": null}, {"key": "question-2", "text": "How do you change the airflow direction of the front vents in the new Model B?", "kind": "MC", "pick": 1, "responses": [{"t": "A", "c": false, "img": "model-b-hands-on_4"}, {"t": "B", "c": false, "img": "model-b-hands-on_5"}, {"t": "C", "c": true, "img": "model-b-hands-on_6"}], "fact": "Airflow is set in the climate menu on the main screen: drag a vent icon to aim it.\n\nPress and hold a preset for two seconds to save your vent positions.", "image": null}, {"key": "question-3", "text": "Which is TRUE about adjusting the rear seats in the new Model B?", "kind": "MC", " function rng(seed){let s=seed|0||1;return()=>((s=Math.imul(s^s>>>15,1|s),s^=s+Math.imul(s^s>>>7,61|s),((s^s>>>14)>>>0)/4294967296));}
function hash(str){let h=2166136261;for(const c of str)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}
function roster(t){
  const r=rng(t*97+5),pool=NAMES.map(x=>x).sort(()=>r()-.5).slice(0,8);
  return pool.map((n,i)=>{const q=rng(t*31+i);const prog=4+Math.floor(q()*5);return{first:n[0],last:n[1],dealer:DEALERS[1+Math.floor(q()*5)],prog,tokens:prog*25+Math.floor(q()*40),close:q()>.3?Math.round(60+q()*40):null};});
}

function fakeAnswer(seg,q,who){
  const r=rng(hash(seg.id+q.key+who)),res=q.responses||[];
  if(seg.kind==='quiz'){const ci=res.findIndex(x=>x.c);return r()<.72?[ci]:[Math.floor(r()*res.length)];}
  if(q.kind==='PICKX'&&q.pick>1)return res.map((_,i)=>i).sort(()=>r()-.5).slice(0,q.pick);
  if(q.kind==='SCALE')return[Math.min(4,Math.floor(Math.pow(r(),.45)*5))];
  return[Math.min(res.length-1,Math.floor(Math.pow(r(),1.6)*res.length))];
}
function tally(seg,q,qi,people){
  const n=q.kind==='SCALE'?5:(q.responses||[]).length,c=new Array(n).fill(0);
  people.forEach(p=>fakeAnswer(seg,q,p.first+p.last).forEach(i=>c[i]++));
  const mine=S.done[seg.id]?.answers?.[qi];
  if(Array.isArray(mine)&&S.tour===1)mine.forEach(i=>{if(c[i]!==undefined)c[i]++;});
  return c;
}

function slots(seg){
  const out=[{name:seg.tile,label:'Tile image'}];
  seg.questions.forEach((q,i)=>{
    if(q.image)out.push({name:q.image,label:`Question ${i+1}`});
    (q.responses||[]).forEach(r=>{if(r.img)out.push({name:r.img,label:`Question ${i+1} · ${r.t}`});});
  });
  return out;
}
function missingSlots(seg){return slots(seg).filter(s=>!src(seg.id,s.name));}

let RUN=null;
function renderSegment(id){
  const seg=SEG[id];
  if(S.done[id]&&(!RUN||RUN.id!==id))return renderFinish(seg,S.done[id],true);
  if(!RUN||RUN.id!==id)RUN={id,step:-1,answers:[],sel:[],submitted:false};
  if(RUN.step<0)return renderLanding(seg);
  if(RUN.step>=seg.questions.length)return finishSeg(seg);
  renderQuestion(seg);
}
function renderLanding(seg){
  $('#app').innerHTML=`${head()}<div class="wrap">${subBar(true)}
    <div class="land"><div class="pic">${pic(seg.id,seg.tile)}</div>
    <div class="txt"><p class="kicker">${esc(seg.introTitle||seg.title)}</p>${seg.intro?`<p class="intro">${esc(seg.intro)}</p>`:''}
    <button class="btn" id="start">Start</button></div></div></div>`;
  $('#start').onclick=()=>{RUN.step=0;render();};
}
function helpText(q){
  if(q.kind==='SCALE')return'1 = poor, 5 = excellent';
  if(q.kind==='TEXT')return'';
  if(q.kind==='COMMENT')return'Optional';
  if(q.kind==='PICKX'&&q.pick>1)return`Choose ${q.pick}`;
  return'';
}
const facts=t=>String(t||'').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
function renderQuestion(seg){
  const q=seg.questions[RUN.step],n=seg.questions.length,i=RUN.step;
  const isQuiz=seg.kind==='quiz',multi=q.kind==='PICKX'&&q.pick>1,pics=(q.responses||[]).some(r=>r.img);
  const sub=RUN.submitted,correct=(q.responses||[]).findIndex(r=>r.c);
  const showFacts=sub&&isQuiz&&q.fact&&seg.id.startsWith('ho');
  let body='';
  if(q.image)body+=`<div class="q-img">${pic(seg.id,q.image)}</div>`;
  if(q.kind==='SCALE'){
    body+=`<div class="scale">${[1,2,3,4,5].map(v=>`<button data-v="${v-1}" class="${RUN.sel.includes(v-1)?'sel':''}">${v}</button>`).join('')}</div><div class="scale-l"><span>Poor</span><span>Excellent</span></div>`;
  }else if(q.kind==='TEXT'||q.kind==='COMMENT'){
    const max=q.max||500;
    body+=`<div class="field"><textarea id="txt" maxlength="${max}" placeholder="Type here">${esc(RUN.text||'')}</textarea><div class="hint" id="cnt">${(RUN.text||'').length} / ${max}</div></div>`;
  }else{
    body+=`<div class="opts ${pics?'pics':''}">${q.responses.map((r,k)=>{
      let cls='opt'+(pics?' pic':'');
      if(RUN.sel.includes(k))cls+=' sel';
      if(sub&&isQuiz){if(k===correct)cls+=' right';else cls+=RUN.sel.includes(k)?' wrong picked':' wrong';}
      const mk=sub&&isQuiz?(k===correct?IC.check:IC.x):(RUN.sel.includes(k)?IC.check:'');
      if(pics){const u=src(seg.id,r.img);return`<button class="${cls}" data-k="${k}" ${sub?'disabled':''}><span class="pl"><span class="mk">${mk}</span>${esc(r.t.toLowerCase())})${u?`<span class="zoom" data-zoomer="${u}">${IC.enlarge}Enlarge</span>`:''}</span><span class="im">${pic(seg.id,r.img)}</span></button>`;}
      return`<button class="${cls}" data-k="${k}" ${sub?'disabled':''}><span class="mk">${mk}</span><span>${esc(r.t)}</span></button>`;
    }).join('')}</div>`;
  }
  if(showFacts)body+=`<div class="more"><div class="more-h">${IC.info}More info</div><div class="facts">${facts(q.fact).map((f,k)=>`<div class="fact"><span class="no">${String(k+1).padStart(2,'0')}</span><span>${esc(f)}</span></div>`).join('')}</div></div>`;
  const needs=q.kind==='COMMENT'?0:q.kind==='TEXT'?-1:multi?q.pick:1;
  const ready=needs===-1?(RUN.text||'').trim().length>0:needs===0?true:RUN.sel.length===needs;
  const last=i===n-1;
  const label=!sub&&isQuiz?'Submit':(last?'Finish':'Next');
  $('#app').innerHTML=`${head()}<div class="wrap">${subBar(true)}<div class="col">
    <div class="q-head"><div class="prog"><i style="width:${(i+(sub?1:0))/n*100}%"></i></div><span class="q-count">${i+1} / ${n}</span></div>
    <div class="q-title">${esc(seg.label)}</div>
    <div class="q-text"><span>${i+1}.</span><span>${esc(q.text)}</span></div>
    <p class="q-help">${helpText(q)}</p>
    ${body}
  </div></div>
  <div class="actbar"><div class="in"><span class="msg">${!sub&&multi?`${RUN.sel.length} of ${q.pick} chosen`:''}</span><button class="btn" id="next" ${(!sub&&!ready)?'disabled':''}>${label}</button></div></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=e=>{
    if(e.target.closest('[data-zoomer]'))return;
    const k=+b.dataset.k;
    if(multi){if(RUN.sel.includes(k))RUN.sel=RUN.sel.filter(x=>x!==k);else if(RUN.sel.length<q.pick)RUN.sel.push(k);else{toast(`Choose ${q.pick}. Unselect one first.`);return;}}
    else RUN.sel=[k];
    const y=window.scrollY;renderQuestion(seg);window.scrollTo(0,y);
  });
  document.querySelectorAll('.scale button').forEach(b=>b.onclick=()=>{RUN.sel=[+b.dataset.v];renderQuestion(seg);});
  const ta=$('#txt');
  if(ta)ta.oninput=()=>{RUN.text=ta.value;$('#cnt').textContent=`${ta.value.length} / ${ta.maxLength}`;$('#next').disabled=needs===-1&&!ta.value.trim();};
  $('#next').onclick=()=>{
    if(!sub&&isQuiz){RUN.submitted=true;RUN.answers[i]=[...RUN.sel];if(RUN.sel[0]===correct)S.tokens+=10;save();const y=window.scrollY;renderQuestion(seg);window.scrollTo(0,y);return;}
    if(!isQuiz){RUN.answers[i]=(q.kind==='TEXT'||q.kind==='COMMENT')?(RUN.text||''):[...RUN.sel];S.tokens+=5;}
    RUN.step++;RUN.sel=[];RUN.text='';RUN.submitted=false;save();render();
  };
}
function finishSeg(seg){
  let score=0,total=0;
  if(seg.kind==='quiz'){total=seg.questions.length;seg.questions.forEach((q,i)=>{if(q.responses[RUN.answers[i]?.[0]]?.c)score++;});}
  const rec={answers:RUN.answers,score,total};
  S.tokens+=20;S.done[seg.id]=rec;save();
  renderFinish(seg,rec,false);RUN=null;
}
function renderFinish(seg,rec,revisit){
  let inner='';
  if(seg.kind==='quiz'){
    const pct=Math.round(rec.score/rec.total*100);
    inner=`<p class="hint">Your score</p><div class="score">${rec.score} / ${rec.total}</div>
      ${seg.id==='close'?(pct>=80?`<span class="badge pass">${pct}% · Passed. Show this screen to your trainer.</span>`:`<span class="badge fail">${pct}% · 80% needed to pass</span>`):`<p class="sub">${pct}%</p>`}
      <div class="review">${seg.questions.map((q,i)=>{const ok=q.responses[rec.answers[i]?.[0]]?.c;return`<div><span class="ic" style="color:var(--${ok?'ok':'bad'})">${ok?IC.check:IC.x}</span><span>${esc(q.text)}</span></div>`;}).join('')}</div>`;
  }else if(seg.kind==='poll')inner=`<h2>Thanks for voting</h2><p class="sub">Your trainer will share the class results.</p>`;
  else if(seg.kind==='ask')inner=`<h2>Question sent</h2><p class="sub">The training team will answer it in the Q&amp;A follow-up.</p>`;
  else inner=`<h2>Thank you</h2><p class="sub">Your feedback helps plan the next training.</p>`;
  $('#app').innerHTML=`${head()}<div class="wrap">${subBar(true)}<div class="col">${revisit?'<p class="hint">You finished this activity.</p>':''}${inner}</div></div>
  <div class="actbar"><div class="in"><span class="msg"></span><button class="btn" data-go="#/p">Home</button></div></div>`;
}

  return`<div class="tours">${tours.map(n=>`<button class="${S.tour===n?'on':''}" data-tour="${n}">Tour ${n}</button>`).join('')}${allOpt?`<button class="${S.tour===0?'on':''}" data-tour="0">All tours</button>`:''}</div>`;
}
function bindTours(page,arg){document.querySelectorAll('[data-tour]').forEach(b=>b.onclick=()=>{S.tour=+b.dataset.tour;save();renderAdmin(page,arg);});}
function people(){
  const ts=S.tour===0?ROLES[S.role].tours:[S.tour];
  let list=[];ts.forEach(t=>list=list.concat(roster(t).map(p=>({...p,tour:t}))));
  if(S.me&&ts.includes(1))list.unshift({first:S.me.first,last:S.me.last,dealer:S.me.dealer,tour:1,prog:Object.keys(S.done).length,tokens:S.tokens,close:S.done.close?Math.round(S.done.close.score/S.done.close.total*100):null});
  return list;
}
const tourLine=()=>S.tour===0?'All tours':(t=>`Tour ${t.n} · ${t.city} · ${t.date}`)(tourOf(S.tour));

function fakeQR(seed){
  const r=rng(hash(seed)),N=25;let rects='';
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const inF=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);if(!inF&&r()>.52)rects+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}
  return`<svg class="qr" viewBox="-1 -1 ${N+2} ${N+2}" shape-rendering="crispEdges"><rect x="-1" y="-1" width="${N+2}" height="${N+2}" fill="#fff"/>${f(0,0)}${f(N-7,0)}${f(0,N-7)}${rects}</svg>`;
}
function aLive(arg,page){
  if(S.tour===0)S.tour=1;
  const t=tourOf(S.tour),ppl=people();
  $('#main').innerHTML=`<h1>Live class</h1><p class="sub">${tourLine()}</p>${tourBar(page,arg)}
  <div class="live-row">
  <div class="panel join">
    <h3>Tour ${t.n} link</h3>
    ${fakeQR(t.code)}
    <div class="link-box">${linkOf(t)}</div>
    <div style="margin-top:10px"><button class="btn sm sec" id="fullqr">Show on screen</button></div>
  </div>
  <div class="panel" style="padding:0;overflow:auto;flex:1 1 480px"><table class="t"><thead><tr><th>Element</th><th>Done</th><th></th></tr></thead><tbody>
  ${(()=>{const top=[...ppl].sort((a,b)=>b.tokens-a.tokens)[0];return`<tr><td><span style="display:inline-flex;align-items:center;gap:8px"><img src="${TOKEN}" alt="" style="width:22px;height:22px">Tokens</span></td><td>Leader: ${esc(top.first)} ${esc(top.last[0])}. · ${top.tokens}</td><td style="text-align:right"><button class="btn sm sec" id="tokshow">Show scoreboard</button></td></tr>`;})()}
  ${CONTENT.map(s=>{const d=ppl.filter(p=>rng(hash(s.id+p.first))()<.8).length;return`<tr>
    <td>${esc(s.label)}</td><td>${d} / ${ppl.length}</td>
    <td style="text-align:right">${s.kind==='poll'||s.kind==='quiz'?`<button class="btn sm sec" data-present="${s.id}">Show results</button>`:''}</td></tr>`;}).join('')}
  </tbody></table></div></div>`;
  bindTours(page,arg);
  $('#tokshow').onclick=()=>showTokens();
  $('#fullqr').onclick=()=>{const d=document.createElement('div');d.className='present';d.innerHTML=`<img class="brand" src="${LOGO}" alt="Client logo"><button class="btn sm sec x">Close</button><div style="display:grid;place-items:center;min-height:78vh;text-align:center"><div><h2 style="margin:0 0 24px">Scan to join</h2><div style="width:min(52vh,80vw);margin:0 auto">${fakeQR(t.code).replace('class="qr"','style="width:100%;height:auto"')}</div><p style="font-size:22px;margin-top:18px">${linkOf(t)}</p></div></div>`;d.querySelector('.x').onclick=()=>d.remove();document.body.appendChild(d);};
  document.querySelectorAll('[data-present]').forEach(b=>b.onclick=()=>present(b.dataset.present));
}
function barsHTML(seg,q,qi){
  const c=tally(seg,q,qi,people()),tot=c.reduce((a,b)=>a+b,0)||1;
  const labels=q.kind==='SCALE'?['1 · Poor','2','3','4','5 · Excellent']:q.responses.map(r=>r.t);
  return`<div class="bars">${labels.map((l,k)=>`<div class="bar"><div class="bl"><span>${esc(l)}${seg.kind==='quiz'&&q.responses[k].c?' (correct)':''}</span><span>${Math.round(c[k]/tot*100)}%</span></div><div class="bt"><i style="width:${c[k]/tot*100}%"></i></div></div>`).join('')}</div>`;
}
function present(id){
  const seg=SEG[id];let qi=0;
  const d=document.createElement('div');d.className='present';document.body.appendChild(d);
  const draw=()=>{const q=seg.questions[qi];
    d.innerHTML=`<img class="brand" src="${LOGO}" alt="Client logo"><button class="btn sm sec x">Close</button>
      <p class="hint" style="margin:16px 0 0">${esc(seg.label)} · ${qi+1} / ${seg.questions.length}</p><h2>${esc(q.text)}</h2>
      ${barsHTML(seg,q,qi)}
      <div style="margin-top:28px;display:flex;gap:8px">${qi>0?'<button class="btn sec" id="pv">Previous</button>':''}${qi<seg.questions.length-1?'<button class="btn" id="nx">Next question</button>':''}</div>`;
    d.querySelector('.x').onclick=()=>d.remove();
    const pv=d.querySelector('#pv'),nx=d.querySelector('#nx');if(pv)pv.onclick=()=>{qi--;draw();};if(nx)nx.onclick=()=>{qi++;draw();};};
  draw();
}
function tokenTable(list){
  return`<table class="t"><thead><tr><th>#</th><th>Name</th><th class="hide-m">Dealership</th>${S.tour===0?'<th>Tour</th>':''}<th style="text-align:right">Tokens</th></tr></thead><tbody>
  ${list.map((p,i)=>`<tr><td class="rank">${i+1}</td><td>${esc(p.first)} ${esc(p.last)}</td><td class="hide-m">${esc(p.dealer)}</td>${S.tour===0?`<td>${p.tour}</td>`:''}<td class="num">${p.tokens}</td></tr>`).join('')}
  </tbody></table>`;
}
function showTokens(){
  const list=people().sort((a,b)=>b.tokens-a.tokens);
  const d=document.createElement('div');d.className='present';
  d.innerHTML=`<img class="brand" src="${LOGO}" alt="Client logo"><button class="btn sm sec x">Close</button><h2 style="display:flex;align-items:center;gap:14px"><img src="${TOKEN}" alt="" style="width:44px;height:44px">Tokens</h2><p class="hint">${tourLine()}</p>${tokenTable(list)}`;
  d.querySelector('.x').onclick=()=>d.remove();document.body.appendChild(d);
}

/* ---- Content ---- */
const KIND={quiz:'Quiz',poll:'Poll',ask:'Question box',eval:'Evaluation'};
function aContent(id){
  if(SEG[id])return aActivity(id);
  $('#main').innerHTML=`<h1>Content</h1><p class="sub">Each activity has its own upload file and its own images.</p>
  <div class="panel" style="padding:0;overflow:auto"><table class="t"><thead><tr><th>Activity</th><th class="hide-m">Upload file</th><th>Questions</th><th>Images</th><th>Status</th></tr></thead><tbody>
  ${CONTENT.map(s=>{const sl=slots(s),m=missingSlots(s);return`<tr class="link" data-go="#/a/content/${s.id}">
    <td>${esc(s.label)}<div class="hint">${KIND[s.kind]}</div></td>
    <td class="hide-m"><span class="file">${esc(S.uploads[s.id]||s.file)}</span></td>
    <td>${s.questions.length}</td>
    <td>${sl.length-m.length} / ${sl.length}</td>
    <td>${m.length?`<span class="st warn">${m.length} image${m.length>1?'s':''} missing</span>`:'<span class="st ok">Ready</span>'}</td></tr>`;}).join('')}
  </tbody></table></div>`;
}
let PENDING=[];
function aActivity(id){
  const s=SEG[id],sl=slots(s),m=missingSlots(s);
  $('#main').innerHTML=`<div class="crumb"><button class="tbtn" data-go="#/a/content">${IC.back}Content</button></div>
  <h1>${esc(s.label)}</h1><p class="sub">${KIND[s.kind]} · ${s.questions.length} question${s.questions.length>1?'s':''}</p>
  <div class="panel"><div class="ph"><div><h3>Upload file</h3><span class="file">${esc(S.uploads[id]||s.file)}</span><div class="hint">Updated ${S.uploads[id]?'just now':'Nov 10 · Pat Morgan'}</div></div>
    <button class="btn sm sec" data-pv>Preview</button><button class="btn sm" id="upwb">${IC.up}Upload new version</button></div></div>
  <div class="panel"><div class="ph"><div><h3>Images</h3><div class="hint">${sl.length-m.length} of ${sl.length} linked. Files named like the upload file, or just numbered (1.jpg, 2.jpg…), link on their own.</div></div></div>
    <label class="drop" id="dz">Drop images here, or <u>browse</u><input type="file" accept="image/*" multiple class="hidden" id="fi"></label>
    <div id="unm"></div>
    <div class="assets" style="margin-top:16px">${sl.map(x=>{const u=src(id,x.name),isNew=!!OVR[id+':'+x.name];return`<div class="asset ${u?'':'miss'}">
      <div class="th">${u?`<img src="${u}" alt="" data-zoomer="${u}" style="cursor:zoom-in">${isNew?'<span class="new">New</span>':''}`:'Missing'}</div>
      <div class="meta"><span>${esc(x.label)}</span><span class="file">${esc(x.name)}</span>
      <div class="row">${u?'<span class="st ok">Linked</span>':'<span class="st warn">Missing</span>'}<button class="tbtn" data-slot="${esc(x.name)}">${u?'Replace':'Add'}</button></div></div></div>`;}).join('')}</div>
  </div>`;
  $('[data-pv]').onclick=()=>{RUN=null;delete S.done[id];S.me=S.me||{first:'Preview',last:'Mode',dealer:DEALERS[0]};save();location.hash='#/p/seg/'+id;};
  $('#upwb').onclick=()=>uploadModal(id);
  const take=files=>{
    let linked=0;const left=[];
    [...files].forEach(f=>{
      const base=f.name.replace(/\.[^.]+$/,'').toLowerCase(),url=URL.createObjectURL(f);
      const hit=sl.find(x=>x.name.toLowerCase()===base)||(/^\d+$/.test(base)&&sl.find(x=>x.name.toLowerCase().endsWith('_'+base)))||(/^(tile|main)$/.test(base)&&sl[0]);
      if(hit){OVR[id+':'+hit.name]=url;linked++;}else left.push({name:f.name,url,seg:id});
    });
    PENDING=PENDING.concat(left);aActivity(id);
    toast(`${linked} linked${left.length?`, ${left.length} need a match`:''}`);
  };
  const dz=$('#dz'),fi=$('#fi');
  fi.onchange=()=>take(fi.files);
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};
  dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');take(e.dataTransfer.files);};
  const pend=PENDING.filter(p=>p.seg===id);
  if(pend.length){
    $('#unm').innerHTML=`<div class="unmatched"><b style="font-weight:400;font-family:var(--wide)">Link these images</b><p class="hint" style="margin:2px 0 6px">These file names don't match a question. Choose where each one goes.</p>
      ${pend.map((p,k)=>`<div class="u"><img src="${p.url}" alt=""><div style="flex:1;min-width:120px"><span class="file">${esc(p.name)}</span></div>
      <select data-pend="${k}"><option value="">Link to…</option>${sl.map(x=>`<option value="${esc(x.name)}">${esc(x.label)}${src(id,x.name)?'':' (missing)'}</option>`).join('')}</select>
      <button class="tbtn" data-drop="${k}">Remove</button></div>`).join('')}</div>`;
    document.querySelectorAll('[data-pend]').forEach(sel=>sel.onchange=()=>{const p=pend[+sel.dataset.pend];if(!sel.value)return;OVR[id+':'+sel.value]=p.url;PENDING=PENDING.filter(x=>x!==p);aActivity(id);toast('Image linked');});
    document.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>{const p=pend[+b.dataset.drop];PENDING=PENDING.filter(x=>x!==p);aActivity(id);});
  }
  document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{
    const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=()=>{if(inp.files[0]){OVR[id+':'+b.dataset.slot]=URL.createObjectURL(inp.files[0]);aActivity(id);toast('Image linked');}};inp.click();
  });
}
function uploadModal(id){
  const s=SEG[id];
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><h3>Upload new version</h3><p class="hint">${esc(s.label)} · now using <span class="file">${esc(S.uploads[id]||s.file)}</span></p>
    <label class="drop" id="dz2">Drop the .xlsx file here, or <u>browse</u><input type="file" accept=".xlsx" class="hidden" id="fi2"></label>
    <div id="res"></div>
    <div class="acts"><button class="btn sec" id="cx">Cancel</button><button class="btn" id="pub" disabled>Publish</button></div></div>`;
  document.body.appendChild(bg);
  const dz=bg.querySelector('#dz2'),fi=bg.querySelector('#fi2'),res=bg.querySelector('#res'),pub=bg.querySelector('#pub');let chosen=null;
  bg.querySelector('#cx').onclick=()=>bg.remove();
  bg.onclick=e=>{if(e.target===bg)bg.remove();};
  const run=f=>{chosen=f;res.innerHTML=`<ul class="check"><li><span class="i">…</span>Checking ${esc(f.name)}</li></ul>`;
    setTimeout(()=>{
      const okType=/\.xlsx$/i.test(f.name),m=missingSlots(s),rows=[];
      rows.push(okType?['✓','ok','File read']:['✕','bad','This isn’t an .xlsx file']);
      if(okType){rows.push(['✓','ok',`${s.questions.length} questions found`]);
        rows.push(['✓','ok','Every question has answers']);
        if(s.kind==='quiz')rows.push(['✓','ok','Each quiz question has one correct answer']);
        rows.push(m.length?['!','warn',`${m.length} image${m.length>1?'s':''} still missing. Add them under Images.`]:['✓','ok','All images linked']);
        rows.push(['i','g60','Earlier answers are kept.']);}
      res.innerHTML=`<ul class="check">${rows.map(r=>`<li><span class="i" style="color:var(--${r[1]})">${r[0]==='✓'?IC.check:r[0]==='✕'?IC.x:r[0]}</span>${esc(r[2])}</li>`).join('')}</ul>`;
      pub.disabled=!okType;
    },700);};
  fi.onchange=()=>fi.files[0]&&run(fi.files[0]);
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};
  dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');if(e.dataTransfer.files[0])run(e.dataTransfer.files[0]);};
  pub.onclick=()=>{S.uploads[id]=chosen.name;save();bg.remove();aActivity(id);toast('Published');};
}

/* ---- Results / people / users / programs / reports ---- */
function aResults(arg){
  const pick=SEG[arg]?arg:'close',seg=SEG[pick],client=S.role==='client';
  const asks=['Does Model B have a heated steering wheel on every trim?','What is the towing capacity with the new-engine-x?','When will dealer demo units arrive?','Can the third row fold flat with the cargo package?'];
  $('#main').innerHTML=`<h1>Results</h1><p class="sub">${tourLine()}${client?' · names hidden':''}</p>${tourBar('results',arg,true)}
    <div class="seg-pick">${CONTENT.map(s=>`<button class="${s.id===pick?'on':''}" data-go="#/a/results/${s.id}">${esc(s.label)}</button>`).join('')}</div>
    ${seg.kind==='ask'?`<div class="panel" style="padding:0"><table class="t"><tbody>${asks.concat(S.done.ask?[S.done.ask.answers[0]]:[]).map((x,i)=>`<tr><td>${esc(x)}</td></tr>`).join('')}</tbody></table></div>`:
      seg.questions.map((q,qi)=>q.kind==='TEXT'||q.kind==='COMMENT'?'':`<div class="panel"><h3>${qi+1}. ${esc(q.text)}</h3>${barsHTML(seg,q,qi)}</div>`).join('')}
    <button class="btn sm sec" id="exp">${IC.down}Export to Excel</button>`;
  bindTours('results',arg);
  $('#exp').onclick=()=>toast('Prototype: export not active');
}
function aPeople(arg,page){
  const list=people();
  $('#main').innerHTML=`<h1>Participants</h1><p class="sub">${tourLine()} · ${list.length} people</p>${tourBar(page,arg,true)}
  <div class="panel" style="padding:0;overflow:auto"><table class="t"><thead><tr><th>Name</th><th class="hide-m">Dealership</th>${S.tour===0?'<th>Tour</th>':''}<th>Done</th><th>Close quiz</th></tr></thead><tbody>
  ${list.map(p=>`<tr><td>${esc(p.first)} ${esc(p.last)}</td><td class="hide-m">${esc(p.dealer)}</td>${S.tour===0?`<td>${p.tour}</td>`:''}<td>${Math.min(p.prog,CONTENT.length)} / ${CONTENT.length}</td><td>${p.close===null?'<span class="st grey">Not yet</span>':p.close>=80?`<span class="st ok">${p.close}%</span>`:`<span class="st bad">${p.close}%</span>`}</td></tr>`).join('')}
  </tbody></table></div><button class="btn sm sec" id="exp">${IC.down}Export to Excel</button>`;
  bindTours(page,arg);
  $('#exp').onclick=()=>toast('Prototype: export not active');
}
function aReports(){
  $('#main').innerHTML=`<h1>Reports</h1><p class="sub">Summaries for the client.</p>
  <div class="panel" style="padding:0"><table class="t"><thead><tr><th>Report</th><th>Covers</th><th></th></tr></thead><tbody>
  ${[['Weekly evaluation report','Tours 1–2 · Nov 18–19'],['Participant Q&A','All tours to date'],['Certification list','Close quiz 80%+'],['Polls summary','Confidence check, first impressions']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td style="text-align:right"><button class="btn sm sec" data-dl>${IC.down}PDF</button></td></tr>`).join('')}
  </tbody></table></div>`;
  document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>toast('Prototype: download not active'));
}
const PERMS=[
  ['Answer activities',[0,0,0,1]],
  ['See live class and links',[1,'Own tours',0,0]],
  ['See Tokens scoreboard',[1,'Own tours',0,0]],
  ['See participant names',[1,'Own tours',0,0]],
  ['See results',[1,'Own tours','All tours, no names',0]],
  ['Upload files and images',[1,0,0,0]],
  ['Download reports',[1,1,1,0]],
  ['Invite staff and set roles',[1,0,0,0]],
  ['Sign-in',['Password + 2-step','Password + 2-step','Password + 2-step','Name only']]
];
function aUsers(){
  const cell=v=>v===1?`<span class="y" style="display:inline-block">${IC.check}</span>`:v===0?'<span class="n">–</span>':`<span class="hint">${v}</span>`;
  $('#main').innerHTML=`<h1>Users &amp; roles</h1><p class="sub">Admins invite staff and choose their role. Participants don't need an account.</p>
  <div class="panel" style="padding:0;overflow:auto"><table class="t"><thead><tr><th>Name</th><th>Role</th><th class="hide-m">Access to</th><th class="hide-m">2-step sign-in</th><th></th></tr></thead><tbody>
  ${S.users.map((u,i)=>`<tr><td>${esc(u.name)}<div class="hint">${esc(u.email)}</div></td><td><span class="tag ${u.role==='admin'?'dark':''}">${ROLES[u.role].name.replace(' (Tour 1)','')}</span></td><td class="hide-m">${esc(u.scope)}</td><td class="hide-m">${u.tfa?'<span class="st ok">On</span>':'<span class="st warn">Invite pending</span>'}</td><td style="text-align:right">${i?`<button class="tbtn" data-edit="${i}">Change</button>`:''}</td></tr>`).join('')}
  </tbody></table></div>
  <button class="btn" id="inv">Invite someone</button>
  <div class="panel" style="margin-top:24px;overflow:auto"><h3 style="margin-bottom:12px">What each role can do</h3>
  <table class="t matrix"><thead><tr><th></th><th>Admin</th><th>Trainer</th><th>Client</th><th>Participant</th></tr></thead><tbody>
  ${PERMS.map(p=>`<tr><td>${p[0]}</td>${p[1].map(v=>`<td>${cell(v)}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div>`;
  $('#inv').onclick=()=>inviteModal();
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>inviteModal(+b.dataset.edit));
}
function inviteModal(idx){
  const u=idx!=null?S.users[idx]:null;
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><h3>${u?'Change role':'Invite someone'}</h3>
  <div class="field" style="margin-top:16px"><label>Email</label><input id="em" value="${esc(u?.email||'')}" ${u?'disabled':''} placeholder="name@company.com"></div>
  <div class="field"><label>Role</label><select id="rl">${['admin','trainer','client'].map(k=>`<option value="${k}" ${u?.role===k?'selected':''}>${ROLES[k].name.replace(' (Tour 1)','')}</option>`).join('')}</select></div>
  <div class="field"><label>Access to</label><select id="sc"><option>All tours</option>${TOURS.map(t=>`<option>Tour ${t.n}</option>`).join('')}<option>All tours · results only</option></select></div>
  <p class="hint">They get an email, set a password and turn on 2-step sign-in.</p>
  <div class="acts"><button class="btn sec" id="cx">Cancel</button><button class="btn" id="ok">${u?'Save':'Send invite'}</button></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector('#cx').onclick=()=>bg.remove();
  bg.querySelector('#ok').onclick=()=>{const role=bg.querySelector('#rl').value,scope=bg.querySelector('#sc').value;
    if(u){u.role=role;u.scope=scope;}else{const em=bg.querySelector('#em').value.trim();if(!em){toast('Add an email');return;}S.users.push({name:em.split('@')[0],email:em,role,scope,tfa:false});}
    save();bg.remove();aUsers();toast(u?'Role updated':'Invite sent (prototype)');};
}
function aPrograms(){
  $('#main').innerHTML=`<h1>Programs</h1><p class="sub">Each program has its own tours and links.</p>
  <div class="panel" style="padding:0"><table class="t"><thead><tr><th>Program</th><th>Tours</th><th>Status</th></tr></thead><tbody>
  <tr class="link" data-go="#/a/content"><td>${APP_TITLE}</td><td>5</td><td><span class="st ok">Live</span></td></tr>
  <tr><td>Program 2</td><td>4</td><td><span class="st grey">Draft</span></td></tr>
  </tbody></table></div>`;
}

render();
</script>
